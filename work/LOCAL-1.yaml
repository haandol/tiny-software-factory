# 2단계 첫 작업 명세. 3단계부터는 Linear 이슈가 이 형식으로 바뀐다.
work_item: LOCAL-1
target: product
goal: >
  이미지를 받아 키를 발급하고, Codex를 헤드리스로 호출해 같은 구도의
  three.js 프리비즈 장면 파일을 저장하고, /view?key= 에서 보여 주는
  단일 파일 app.py를 만든다.
keep:
  - 카메라 시점과 화각
  - 지평선과 바닥
  - 벽
  - 주요 물체의 위치·크기·대표 색
  - 주광 방향
drop:
  - 질감
  - 세부 형상
  - 작은 물체
constraints:
  - Python 단일 파일 app.py
  - CONTRACT.md 준수
  - three.js 로컬 사본 사용
acceptance:
  - run
  - contract-smoke
  - suite: public
    metrics:
      camera.fov_error_deg: "<= 15"
      objects.f1: ">= 0.3"
  - holdout-regression      # 첫 작업은 비교할 main이 없으므로 생략된다
