# 요구사항 변경: Codex를 app-server 방식으로, 모델은 GPT-6.1-Sol (사용자 지시, 2026-11-23)
work_item: LOCAL-2
target: product
goal: >
  Codex 호출을 요청마다 codex exec 프로세스를 띄우는 방식에서 codex app-server 방식으로 바꾼다.
  앱이 시작할 때 codex app-server를 하나 띄우고, 표준 입출력 JSON-RPC로
  initialize → (요청마다) thread/start → turn/start를 보내 측정값 JSON을 받는다.
  모델은 CODEX_HOME 설정(us.openai.gpt-6.1-sol)을 그대로 쓴다.
keep:
  - HTTP 계약, 장면 파일 형식, 뷰어
  - Codex 지시문과 출력 스키마의 의미, 기하 후처리 결과
notes:
  - '프로토콜 정의는 `codex app-server generate-json-schema --out <폴더>`로 얻는다'
  - '이미지 입력은 turn/start의 input에 {"type": "localImage", "path": ...}, 출력 스키마는 turn/start의 outputSchema'
  - '요청이 동시에 여러 개 와도 처리한다 (스레드마다 turn을 하나씩)'
  - 'app-server 프로세스가 죽으면 다시 띄우고, 앱이 끝날 때 함께 끝낸다'
  - 'app-server는 앱과 같은 프로세스 그룹에서 실행한다. 평가기가 프로세스 그룹을 보고 확인한다'
constraints:
  - 진입점 uv run app.py 유지
  - 모델을 코드에서 지정하지 않는다 (CODEX_HOME 설정을 따른다)
acceptance:
  - run
  - contract-smoke
  - process: codex app-server
    absent: codex exec
  - suite: public
    metrics:
      camera.fov_error_deg: "<= 3"
      objects.f1: ">= 0.9"
  - holdout-regression
